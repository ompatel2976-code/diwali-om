<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shubh Deepawali</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Mukta:wght@400;600&family=Yatra+One&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: a full-bleed 3D night courtyard. The couple stand in the middle on a rangoli, apartment towers and
   fairy lights behind, crackers laid out on the ground in front, fireworks in the sky. Marigold toran, falling petals and UI float on top.
   Committed to a single dark look on purpose. */
:root{
  --night:#06040f; --gold:#ffc65a; --marigold:#ff9f1c; --rani:#e8337a; --peacock:#14b8a6; --paper:#fdebd0;
  --glass:rgba(18,8,28,.66); --line:rgba(255,198,90,.3);
  --display:'Yatra One','Noto Serif Devanagari',Georgia,serif;
  --body:'Mukta','Segoe UI',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--paper);font-family:var(--body)}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:crosshair;background:#0a0618}
#stage *{pointer-events:none}
#stage canvas,#stage .layer{position:absolute;left:0;top:0;width:100%;height:100%}
#glow{mix-blend-mode:screen}
#hud{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
#hud .brk{position:absolute;left:-26px;top:-26px;width:52px;height:52px;
  background:
   linear-gradient(var(--gold),var(--gold)) 0 0/8px 1.5px no-repeat,linear-gradient(var(--gold),var(--gold)) 0 0/1.5px 8px no-repeat,
   linear-gradient(var(--gold),var(--gold)) 100% 0/8px 1.5px no-repeat,linear-gradient(var(--gold),var(--gold)) 100% 0/1.5px 8px no-repeat,
   linear-gradient(var(--gold),var(--gold)) 0 100%/8px 1.5px no-repeat,linear-gradient(var(--gold),var(--gold)) 0 100%/1.5px 8px no-repeat,
   linear-gradient(var(--gold),var(--gold)) 100% 100%/8px 1.5px no-repeat,linear-gradient(var(--gold),var(--gold)) 100% 100%/1.5px 8px no-repeat;
  animation:brk 1.2s ease-in-out infinite alternate}
@keyframes brk{from{transform:scale(1)}to{transform:scale(.88)}}
#hud .txt{position:absolute;left:36px;top:-21px;font:500 10px/1.5 var(--mono);color:rgba(255,236,200,.95);white-space:pre;text-shadow:0 0 6px #000}
#hud.flip .txt{left:auto;right:36px;text-align:right}

/* opening veil: a single diya flame, then the courtyard fades in */
#veil{position:fixed;inset:0;z-index:10;pointer-events:none;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 55%,#1a0a24 0%,#06040f 72%);animation:veil 2.2s var(--out) .5s forwards}
#veil svg{width:54px;height:72px;animation:flame 1s ease-in-out infinite alternate}
@keyframes veil{0%{opacity:1;visibility:visible}80%{opacity:0}100%{opacity:0;visibility:hidden}}
@keyframes flame{from{transform:scale(.92,1) rotate(-2deg);filter:drop-shadow(0 0 10px #ff9f1c)}to{transform:scale(1.06,1.1) rotate(2deg);filter:drop-shadow(0 0 24px #ffc65a)}}

.top{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;
  top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.title{min-width:0}
.title h1{margin:0;font:400 30px/1.15 var(--display);
  background:linear-gradient(100deg,#ff9f1c 0%,#ffd98a 30%,#fff1c9 45%,#ffc65a 60%,#ff9f1c 100%);background-size:240% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,150,40,.45));text-wrap:balance;
  animation:wipe 1.5s var(--out) 1.5s backwards,shimmer 7s linear 3s infinite}
@keyframes wipe{from{clip-path:inset(-20% 100% -20% 0);transform:translateY(8px)}to{clip-path:inset(-20% -5% -20% 0);transform:none}}
@keyframes shimmer{to{background-position:-240% 0}}
.title p{margin:6px 0 0;font:500 11px/1.2 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:rgba(253,235,208,.75);
  animation:track 1.8s var(--out) 1.8s backwards}
@keyframes track{from{letter-spacing:.7em;opacity:0}to{letter-spacing:.22em;opacity:1}}
.orn{display:block;width:140px;height:10px;margin-top:9px;fill:var(--gold);stroke:var(--gold);stroke-width:1;opacity:.85;overflow:visible}
.orn .ln{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s var(--out) 2.2s backwards}
.orn .dm{transform-box:fill-box;transform-origin:center;animation:pop .9s var(--spring) 2.5s backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(0) rotate(120deg)}to{transform:none}}
.tools{display:flex;gap:8px;flex:0 0 auto;pointer-events:auto}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.btn{height:40px;min-width:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--glass);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--gold);display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  transition:transform .35s var(--spring),background .3s,border-color .3s;animation:rise .9s var(--out) calc(2.3s + var(--i,0) * .12s) backwards}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.btn:active{transform:scale(.92)}
.btn[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,159,28,.2)}
.btn:focus-visible,.tool:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#muteBtn .off{display:none}
#muteBtn[aria-pressed="true"] .on{display:none}
#muteBtn[aria-pressed="true"] .off{display:block}
.dock-wrap{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:8px;align-items:center}
.hint{font:400 12px/1.35 var(--mono);color:rgba(253,235,208,.9);background:var(--glass);border:1px solid var(--line);
  padding:6px 12px;border-radius:14px;text-align:center;max-width:100%;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  animation:rise .8s var(--out) 2.7s backwards}
.hint.swap{animation:hintIn .45s var(--out)}
@keyframes hintIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.dock{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:8px;border-radius:22px;background:var(--glass);border:1px solid var(--line);pointer-events:auto;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);scrollbar-width:none;animation:rise .9s var(--out) 2.5s backwards}
.dock::-webkit-scrollbar{display:none}
.tool{position:relative;flex:0 0 auto;width:60px;display:grid;justify-items:center;gap:4px;padding:8px 2px 7px;border-radius:14px;border:1px solid transparent;
  background:transparent;color:rgba(253,235,208,.82);font:500 10px/1 var(--mono);letter-spacing:.03em;cursor:pointer;
  transition:transform .4s var(--spring),background .3s,color .3s,border-color .3s;animation:rise .8s var(--out) calc(2.8s + var(--i,0) * .07s) backwards}
.tool svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--spring)}
@media (hover:hover){.tool:hover{transform:translateY(-3px)}}
.tool:active{transform:scale(.92)}
.tool[aria-pressed="true"]{transform:translateY(-4px);background:linear-gradient(180deg,rgba(255,159,28,.3),rgba(232,51,122,.22));border-color:var(--gold);color:var(--gold)}
.tool[aria-pressed="true"] svg{transform:scale(1.14) rotate(-6deg)}
.tool[aria-pressed="true"]::after{content:"";position:absolute;inset:0;border-radius:14px;box-shadow:0 0 20px rgba(255,159,28,.5);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (max-width:420px){.title h1{font-size:26px}.tool{width:56px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="stage">
  <canvas id="gl" aria-label="3D night courtyard with two people celebrating Diwali"></canvas>
  <canvas id="toran"></canvas>
  <div id="glow" class="layer"></div>
  <div id="hud" hidden><div class="brk"></div><div class="txt" id="hudTxt"></div></div>
</div>
<div id="inset" style="position:fixed;left:0;top:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)"></div>
<div id="veil" aria-hidden="true"><svg viewBox="0 0 54 72"><path d="M27 2c8 14 20 24 20 42a20 20 0 0 1-40 0C7 26 19 18 27 2z" fill="#ffb23a"/><path d="M27 30c4 8 9 12 9 20a9 9 0 0 1-18 0c0-8 5-12 9-20z" fill="#fff2c8"/></svg></div>

<header class="top">
  <div class="title">
    <h1>शुभ दीपावली</h1><p>Shubh Deepawali</p>
    <svg class="orn" viewBox="0 0 140 10" aria-hidden="true"><path class="ln" pathLength="1" d="M2 5H58M82 5H138" fill="none"/><path class="dm" d="M70 .8 75.2 5 70 9.2 64.8 5z"/></svg>
  </div>
  <div class="tools">
    <button class="btn" id="tiltBtn" type="button" aria-pressed="false" aria-label="Steer with phone tilt" style="--i:0">
      <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.4" transform="rotate(18 12 12)"/><path d="M12 18.4h.01"/></svg>
      <span id="tiltLabel">Tilt</span>
    </button>
    <button class="btn" id="muteBtn" type="button" aria-pressed="false" aria-label="Mute sound" style="--i:1">
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6L12 18.5v-13L7.6 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6L12 18.5v-13L7.6 9.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </div>
</header>

<div class="dock-wrap">
  <div id="hint" class="hint" aria-live="polite"></div>
  <div id="dock" class="dock" role="toolbar" aria-label="Crackers"></div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const $ = s => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobile = Math.min(innerWidth, innerHeight) < 600;
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const stage = $('#stage'), glCanvas = $('#gl'), toranC = $('#toran'), tctx = toranC.getContext('2d'), glow = $('#glow');
const hintEl = $('#hint'), dockEl = $('#dock'), wrapEl = $('.dock-wrap'), insetEl = $('#inset'), hud = $('#hud'), hudTxt = $('#hudTxt');

let W = 0, H = 0, safeTop = 0, time = 0, lastInputT = -99;

/* ---------------------------------------------------------------- tools */
const TOOLS = [
  { id: 'sparkler', name: 'Sparkler', hint: 'Press and drag to wave your phuljhadi in front of them.',
    icon: '<path d="M5 21 13.5 12.5"/><path d="M15 9V4M15 9l4-3.5M15 9l4.5 1M15 9l-4-3.5M15 9l-4.8.8"/>' },
  { id: 'anar', name: 'Anar', hint: 'Press the ground to light an anar. It changes colour as it burns.',
    icon: '<path d="M8 21h8l1.4-7H6.6z"/><path d="M12 11V4M9.5 11 7 6M14.5 11 17 6"/>' },
  { id: 'chakri', name: 'Chakri', hint: 'Press the ground, then drag to chase the chakri. Tilting moves every chakri.',
    icon: '<circle cx="12" cy="12" r="8"/><path d="M12 8a4 4 0 1 0 4 4"/><circle cx="12" cy="12" r="1"/>' },
  { id: 'rocket', name: 'Rocket', hint: 'Press the ground to launch. Drag to steer. The camera tracks it up.',
    icon: '<path d="M12 2.5c3.2 3 4.2 7.2 3.2 12H8.8c-1-4.8 0-9 3.2-12z"/><path d="M8.8 14.5 6 18.5M15.2 14.5 18 18.5M12 17v4.5"/><circle cx="12" cy="9" r="1.4"/>' },
  { id: 'skyshot', name: 'Sky Shot', hint: 'Tap anywhere in the sky to fire a shell to that spot.',
    icon: '<path d="M12 3v5M12 16v5M3 12h5M16 12h5M5.6 5.6l3.5 3.5M14.9 14.9l3.5 3.5M18.4 5.6l-3.5 3.5M9.1 14.9l-3.5 3.5"/>' },
  { id: 'bomb', name: 'Atom Bomb', hint: 'Press the ground. Cover your ears. So will they.',
    icon: '<circle cx="11" cy="14" r="6.5"/><path d="M15.2 9.4c1.8-1.8 3-1.6 4-3.4"/><path d="M19.5 2.5v3M18 4h3"/>' },
  { id: 'laadi', name: 'Laadi', hint: 'Press the ground to lay a laadi. It pops from one end to the other.',
    icon: '<path d="M3 7l3.5 9L10 7l3.5 9L17 7l3.5 9"/>' }
];
let tool = 'rocket';
function buildDock() {
  TOOLS.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tool'; b.id = 'tool-' + t.id; b.style.setProperty('--i', TOOLS.indexOf(t));
    b.setAttribute('aria-pressed', t.id === tool ? 'true' : 'false');
    b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + t.icon + '</svg><span>' + t.name + '</span>';
    b.addEventListener('click', () => selectTool(t.id, true));
    dockEl.appendChild(b);
  });
  setHint();
}
function selectTool(id, scroll) {
  tool = id;
  TOOLS.forEach(t => $('#tool-' + t.id).setAttribute('aria-pressed', t.id === id ? 'true' : 'false'));
  setHint();
  if (scroll) { const b = $('#tool-' + id); dockEl.scrollTo({ left: b.offsetLeft - dockEl.clientWidth / 2 + b.offsetWidth / 2, behavior: 'smooth' }); }
}
function setHint() { hintEl.textContent = TOOLS.find(t => t.id === tool).hint; hintEl.classList.remove('swap'); void hintEl.offsetWidth; hintEl.classList.add('swap'); }
buildDock();

/* ---------------------------------------------------------------- renderer, scene, camera */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  hintEl.textContent = 'This viewer cannot run 3D graphics (WebGL is unavailable).';
  return;
}
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x140a28, 0.02);
const FOV = 52;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 200);
const camBase = V(0, 1.9, 10), camTarget = V(0, 0.8, 0), camLook = V(0, 0.8, 0);
let fwScale = 1, halfWAt = z => 3;

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tex(c, rep) {
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}

/* sky gradient */
{
  const c = mk(4, 512), g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#04030c'); gr.addColorStop(0.45, '#12072a'); gr.addColorStop(0.75, '#2d1034'); gr.addColorStop(1, '#3d1530');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  scene.background = tex(c);
}

/* lights */
scene.add(new THREE.HemisphereLight(0x6a58b0, 0x2a1220, 0.75));
const rim = new THREE.DirectionalLight(0xff9a5a, 0.9); rim.position.set(-4, 5, -5); scene.add(rim);
const key = new THREE.PointLight(0xffc88a, 1.1, 16, 1.2); key.position.set(0.6, 2.3, 3.4); scene.add(key);
const fwLight = new THREE.PointLight(0xffffff, 0, 40, 1); fwLight.position.set(0, 7, -9); scene.add(fwLight);
const fwFill = new THREE.PointLight(0xffffff, 0, 24, 1); fwFill.position.set(0, 3, 5); scene.add(fwFill);
const gl1 = new THREE.PointLight(0xffa040, 0, 7, 1.5), gl2 = new THREE.PointLight(0xffa040, 0, 7, 1.5); scene.add(gl1, gl2);

/* ---------------------------------------------------------------- particle system (additive points) */
const MAXP = mobile ? 3600 : 6500;
const PA = { pos: new Float32Array(MAXP * 3), vel: new Float32Array(MAXP * 3), col: new Float32Array(MAXP * 3),
  size: new Float32Array(MAXP), alpha: new Float32Array(MAXP), life: new Float32Array(MAXP), max: new Float32Array(MAXP),
  g: new Float32Array(MAXP), d: new Float32Array(MAXP), s0: new Float32Array(MAXP), tw: new Float32Array(MAXP),
  trail: new Float32Array(MAXP), tt: new Float32Array(MAXP), ph: new Float32Array(MAXP) };
let NP = 0;
const ptGeo = new THREE.BufferGeometry();
ptGeo.setAttribute('position', new THREE.BufferAttribute(PA.pos, 3).setUsage(THREE.DynamicDrawUsage));
ptGeo.setAttribute('aColor', new THREE.BufferAttribute(PA.col, 3).setUsage(THREE.DynamicDrawUsage));
ptGeo.setAttribute('aSize', new THREE.BufferAttribute(PA.size, 1).setUsage(THREE.DynamicDrawUsage));
ptGeo.setAttribute('aAlpha', new THREE.BufferAttribute(PA.alpha, 1).setUsage(THREE.DynamicDrawUsage));
ptGeo.setDrawRange(0, 0);
const ptUniforms = { uScale: { value: 600 } };
const ptVert = 'attribute float aSize;attribute float aAlpha;attribute vec3 aColor;varying vec3 vC;varying float vA;uniform float uScale;' +
  'void main(){vC=aColor;vA=aAlpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=max(1.0,aSize*uScale/-mv.z);gl_Position=projectionMatrix*mv;}';
const ptFrag = 'varying vec3 vC;varying float vA;void main(){vec2 d=gl_PointCoord-0.5;float r=length(d)*2.0;if(r>1.0)discard;' +
  'float core=smoothstep(0.38,0.0,r);float halo=pow(1.0-r,2.4);vec3 c=mix(vC,vec3(1.0),core*0.85);float a=(halo*0.9+core);gl_FragColor=vec4(c*a,a*vA);}';
const ptMat = new THREE.ShaderMaterial({ uniforms: ptUniforms, vertexShader: ptVert, fragmentShader: ptFrag, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
const points = new THREE.Points(ptGeo, ptMat); points.frustumCulled = false; scene.add(points);

const colCache = new Map();
function col(h, s, l) {
  s = s == null ? 1 : s; l = l == null ? 0.6 : l;
  const k = h + '|' + s + '|' + l; let c = colCache.get(k);
  if (!c) { const t = new THREE.Color().setHSL(h / 360, s, l); c = [t.r, t.g, t.b]; colCache.set(k, c); }
  return c;
}
const CW = [1, 1, 1], CG = col(42, 1, 0.62), CO = col(26, 1, 0.58);
function emit(x, y, z, vx, vy, vz, o) {
  if (NP >= MAXP) return;
  const i = NP++, i3 = i * 3, c = o.c || CG;
  PA.pos[i3] = x; PA.pos[i3 + 1] = y; PA.pos[i3 + 2] = z;
  PA.vel[i3] = vx; PA.vel[i3 + 1] = vy; PA.vel[i3 + 2] = vz;
  PA.col[i3] = c[0]; PA.col[i3 + 1] = c[1]; PA.col[i3 + 2] = c[2];
  PA.life[i] = PA.max[i] = o.life; PA.g[i] = o.g == null ? 8 : o.g; PA.d[i] = o.d == null ? 0.985 : o.d;
  PA.s0[i] = o.s || 0.12; PA.tw[i] = o.tw ? 1 : 0; PA.trail[i] = o.trail || 0; PA.tt[i] = 0; PA.ph[i] = Math.random() * 6.28;
}
function killP(i) {
  const j = --NP; if (i === j) return;
  const i3 = i * 3, j3 = j * 3;
  for (let k = 0; k < 3; k++) { PA.pos[i3 + k] = PA.pos[j3 + k]; PA.vel[i3 + k] = PA.vel[j3 + k]; PA.col[i3 + k] = PA.col[j3 + k]; }
  PA.life[i] = PA.life[j]; PA.max[i] = PA.max[j]; PA.g[i] = PA.g[j]; PA.d[i] = PA.d[j]; PA.s0[i] = PA.s0[j];
  PA.tw[i] = PA.tw[j]; PA.trail[i] = PA.trail[j]; PA.tt[i] = PA.tt[j]; PA.ph[i] = PA.ph[j];
}
function stepParts(dt) {
  const k = dt * 60;
  for (let i = 0; i < NP; i++) {
    PA.life[i] -= dt;
    if (PA.life[i] <= 0) { killP(i); i--; continue; }

  tiltLabel.textContent = { off: 'Tilt', wait: 'Tilt…', on: 'Tilt on', na: 'No gyro', denied: 'Tilt denied' }[state] || 'Tilt';
  if (!tilt.on) { tilt.x = 0; tilt.y = 0; }

function layout() {
  W = window.innerWidth; H = window.innerHeight; const aspect = W / H;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, mobile ? 1.75 : 2)); renderer.setSize(W, H, false);
  glCanvas.style.width = W + 'px'; glCanvas.style.height = H + 'px';
  camera.aspect = aspect; safeTop = parseFloat(getComputedStyle(insetEl).paddingTop) || 0;
  const tanH = Math.tan(FOV * Math.PI / 360), D = clamp(4.6 / (2 * tanH * aspect), 7.2, 12.5);
  camBase.set(0, 1.9, D); camTarget.set(0, 0.62 + (aspect < 0.7 ? 0.1 : 0), 0);
  camera.updateProjectionMatrix();
  halfWAt = z => (D - z) * tanH * aspect;
  fwScale = clamp(halfWAt(-8) / 4.4, 0.62, 1.3);
  ptUniforms.uScale.value = H * renderer.getPixelRatio() / (2 * tanH);
  tDpr = Math.min(window.devicePixelRatio || 1, 2);
  toranC.width = Math.round(W * tDpr); toranC.height = Math.round(H * tDpr); toranC.style.width = W + 'px'; toranC.style.height = H + 'px';
  tN = Math.max(2, Math.round(W / 190)); tSag = Math.min(34, W * 0.07);
  flowerSp = ['#ffae1a', '#ff8a1f', '#ffc83d'].map(cl => makeFlowerSprite(cl, 6.2, tDpr));
  initPetals(); drawOverlay(0);
}

/* ---------------------------------------------------------------- animation of the characters */
const skirt = couple.userData.skirt, manG = couple.userData.man, womG = couple.userData.wom;
let nextBlink = 2.5, blinkT = -1;
function animateChars(dt) {
  const t = time, sm = 1 - Math.pow(0.01, dt), cheer = react.cheerT > 0;
  couple.rotation.z = Math.sin(t * 1.1) * 0.012; skirt.rotation.y = Math.sin(t * 0.9) * 0.18;
  react.lookT = Math.max(0, react.lookT - dt); react.cheerT = Math.max(0, react.cheerT - dt); react.startleT = Math.max(0, react.startleT - dt);
  const bounce = react.startleT > 0 ? Math.abs(Math.sin(react.startleT * 9)) * 0.05 * Math.min(1, react.startleT) : Math.abs(Math.sin(t * 2.2)) * 0.004;
  couple.position.y = bounce;
  manG.scale.y = 1 + Math.sin(t * 1.9) * 0.004; womG.scale.y = 1 + Math.sin(t * 1.9 + 0.8) * 0.004;
  // blink
  if (blinkT < 0 && t > nextBlink) blinkT = 0;
  let bl = 1; if (blinkT >= 0) { blinkT += dt; const k = blinkT / 0.16; bl = 1 - Math.sin(Math.min(1, k) * Math.PI) * 0.9; if (k >= 1) { blinkT = -1; nextBlink = t + rnd(2.2, 5.2); } }
  for (const h of [headW, headM]) {
    const isW = h === headW; let yaw = Math.sin(t * 0.7 + (isW ? 0 : 1.3)) * 0.06, pit = Math.sin(t * 0.9) * 0.03;
    if (react.lookT > 0) { yaw = clamp(react.look.x * 0.05, -0.35, 0.35); pit = clamp((react.look.y - 1.5) * 0.04, -0.1, 0.25); }
    h.rotation.y = lerp(h.rotation.y, yaw, sm); h.rotation.x = lerp(h.rotation.x, -pit, sm); h.rotation.z = (isW ? -0.2 : 0.2) + Math.sin(t * 1.3 + (isW ? 0 : 2)) * 0.015;
    for (const e of h.userData.eyes) e.scale.y = bl;
  }
  headW.userData.jh.forEach((j, i) => { j.rotation.z = Math.sin(t * 3.1 + i) * 0.16 + (cheer ? Math.sin(t * 12 + i) * 0.16 : 0); });
  if (anim.dupGeo) {
    const P = anim.dupGeo.attributes.position, B = anim.dupBase, n = anim.dupN;
    for (let i = 0; i <= n; i++) {
      const f = i / n, w = Math.sin(t * 2.2 + i * 0.5) * 0.014 * f + (cheer ? Math.sin(t * 9 + i * 0.7) * 0.01 * f : 0);
      for (let s = 0; s < 2; s++) { const a = (i * 2 + s) * 3; P.array[a + 2] = B[a + 2] + w; P.array[a] = B[a] + w * 0.4 * (s ? 1 : -1); }
    }
    P.needsUpdate = true;
  }
  const jig = cheer ? 3 : 1; for (const c of anim.coins) c.m.position.y = c.y + Math.sin(t * 3.4 + c.ph) * 0.0018 * jig;
  const wave = Math.sin(t * 13) * 0.2;
  const aw = cheer ? -(2.5 + wave) : -0.35 + Math.sin(t * 1.6) * 0.03, am = cheer ? (2.6 - wave) : 0.16 + Math.sin(t * 1.4) * 0.03;
  armWFree.rotation.z = lerp(armWFree.rotation.z, aw, 1 - Math.pow(0.002, dt)); armMFree.rotation.z = lerp(armMFree.rotation.z, am, 1 - Math.pow(0.002, dt));
}

/* ---------------------------------------------------------------- main loop */
const INTRO = reduceMotion ? 0.05 : 3.4, welcome = reduceMotion ? [] : [1.5, 2.1, 2.7, 3.4];
let introT = 0, wIdx = 0, nextAmb = 0.3, camFollow = 0;
const easeOut3 = k => 1 - Math.pow(1 - k, 3), easeBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function ambient() {
  if (introT < INTRO + 2 || time - lastInputT < 6 || time < nextAmb) return;
  nextAmb = time + (reduceMotion ? 9 : rnd(2.4, 4.8)); let n = 0; for (const it of items) if (it instanceof Shell) n++; if (n >= 2) return;
  const hw = halfWAt(-9) * 0.7, x = rnd(-hw, hw), y = rnd(4.2, 7.6), z = rnd(-11, -8);
  items.push(new Shell(x * 0.4, 0.5, -5, x, y, z, { vol: 0.35, scale: rnd(0.8, 1.05), quiet: true }));
}
const hudP = new THREE.Vector3(); let last = performance.now() / 1000;
function frame(ts) {
  const now = ts / 1000, dt = Math.min(0.05, now - last); last = now;
  if (dt <= 0) { requestAnimationFrame(frame); return; }
  time += dt; introT += dt; lightReq.length = 0;
  while (wIdx < welcome.length && introT >= welcome[wIdx]) {
    wIdx++; const hw = halfWAt(-9) * 0.6, x = rnd(-hw, hw), y = rnd(4.6, 7);
    items.push(new Shell(x * 0.3, 0.5, -5, x, y, rnd(-11, -8.5), { vol: 0.6, scale: rnd(1.0, 1.25), quiet: true })); reactTo(x, y, -9, 'soft');
  }
  for (const it of items) it.update(dt);
  for (const it of items) if (it.done) it.remove(); items = items.filter(i => !i.done);
  for (let i = smokes.length - 1; i >= 0; i--) { const s = smokes[i]; s.t += dt; if (s.t > s.life) { scene.remove(s.s); s.s.material.dispose(); smokes.splice(i, 1); continue; } s.s.position.addScaledVector(s.v, dt); const k = s.r + s.t * 0.7; s.s.scale.set(k, k, 1); s.s.material.opacity = 0.6 * (1 - s.t / s.life); }
  for (let i = waves.length - 1; i >= 0; i--) { const w = waves[i]; w.t += dt; if (w.t > 0.7) { scene.remove(w.m); w.m.material.dispose(); waves.splice(i, 1); continue; } const r = 0.3 + w.t * 7 * (1 - w.t * 0.5); w.m.scale.set(r, r, r); w.m.material.opacity = 0.9 * (1 - w.t / 0.7); }
  lightReq.sort((a, b) => b[4] - a[4]); gl1.intensity = 0; gl2.intensity = 0;
  for (let i = 0; i < Math.min(2, lightReq.length); i++) { const l = lightReq[i]; setGlowLight(i, l[0], l[1], l[2], l[3], l[4]); }
  stepParts(dt); ambient(); animateChars(dt);
  // diyas ignite one by one from the middle outwards, then flicker and shed embers
  for (const d of diyas) {
    const target = d.lit && introT > d.litAt ? 1 : 0; d.k = target > d.k ? Math.min(target, d.k + dt * 2.2) : Math.max(target, d.k - dt * 5);
    const f = 1 + 0.14 * Math.sin(time * 11 + d.ph) + 0.1 * Math.sin(time * 17 + d.ph * 2), e = d.k > 0 ? easeBack(d.k) : 0;
    d.flame.visible = d.inner.visible = d.glow.visible = d.k > 0.001;
    if (d.k > 0.001) { d.flame.scale.set(e, e * f, e); d.inner.scale.set(0.5 * e, 0.55 * e * f, 0.5 * e); d.glow.scale.setScalar(1.2 * e * (0.92 + 0.08 * f)); }
    if (d.k > 0.95 && Math.random() < dt * 1.5) emit(d.g.position.x + rnd(-0.03, 0.03), 0.3, d.g.position.z, rnd(-0.12, 0.12), rnd(0.35, 0.8), rnd(-0.12, 0.12), { life: rnd(1.6, 2.8), s: 0.045, c: CO, g: -0.35, d: 0.99, tw: true });
  }
  key.intensity = 1.35 + 0.08 * Math.sin(time * 9) + 0.05 * Math.sin(time * 13.3);
  if (rangoli) { rangoli.rotation.z += dt * 0.05; rangoliRing.material.opacity = 0.14 + 0.1 * Math.sin(time * 1.6); }
  // fairy lights switch on in a ripple, then twinkle
  { const al = fairyAlpha, half = al.length / 2; for (let i = 0; i < al.length; i++) { const u = (i % half) / half, on = clamp((introT - 0.6 - u * 1.6) / 0.3, 0, 1); al[i] = on * (0.6 + 0.4 * Math.sin(time * 2.2 + i * 1.7)); } fairyGeo.attributes.aAlpha.needsUpdate = true; }
  // camera: opening dolly-in, gentle drift, tilt parallax, rocket tracking, shake
  const rk = hudState.item; let focus = 0;
  if (rk && rk.state === 'fly') focus = 1;
  camFollow = lerp(camFollow, focus, 1 - Math.pow(0.08, dt));
  const ik = 1 - easeOut3(clamp(introT / INTRO, 0, 1));
  const px = Math.sin(time * 0.25) * 0.25 + (tilt.on ? tilt.x * 0.6 : 0), py = Math.sin(time * 0.31) * 0.05 + (tilt.on ? -tilt.y * 0.2 : 0);
  camera.position.set(camBase.x + px + ik * 1.6, camBase.y + py + camFollow * 1.4 + ik * 2.4, camBase.z - camFollow * 1.5 + ik * 5.5);
  camLook.copy(camTarget); if (rk && rk.ny) { camLook.x = lerp(camTarget.x, rk.nx * 0.6, camFollow); camLook.y = lerp(camTarget.y, rk.ny * 0.82, camFollow); camLook.z = lerp(camTarget.z, rk.nz * 0.5, camFollow); }
  if (shakeAmp > 0.004) { camera.position.x += rnd(-1, 1) * shakeAmp; camera.position.y += rnd(-1, 1) * shakeAmp; shakeAmp *= Math.pow(0.02, dt); } else shakeAmp = 0;
  camera.lookAt(camLook); camera.fov = FOV - camFollow * 6; camera.updateProjectionMatrix();
  // rocket HUD
  if (rk && !hud.hidden && rk.rk) {
    hudP.set(rk.nx, rk.ny, rk.nz).project(camera); const sx = (hudP.x * 0.5 + 0.5) * W, sy = (-hudP.y * 0.5 + 0.5) * H;
    hud.style.transform = 'translate(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px)'; hud.classList.toggle('flip', sx > W - 140);
    hud.style.opacity = rk.state === 'fly' ? 1 : Math.max(0, rk.hudFade || 0);
    const alt = Math.max(0, Math.round((rk.ny - 0.8) * 14)), hdg = Math.round(rk.ang * 57.3), spd = Math.round(Math.hypot(rk.vx, rk.vy, rk.vz) * 3.2);
    hudTxt.textContent = 'ALT ' + alt + ' m\nHDG ' + (hdg >= 0 ? '+' : '') + hdg + '°\nSPD ' + spd + ' m/s';
  }
  renderGlow(dt); drawOverlay(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

glCanvas.addEventListener('webglcontextlost', e => { e.preventDefault(); hintEl.textContent = 'Graphics were interrupted. Reload the page to resume.'; });
layout();
let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
requestAnimationFrame(frame);
})();
</script>
